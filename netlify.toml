[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Excepción acotada al wireframe navegable y al prototipo final de Vibra: ambas
# apps compiladas (Figma Make / Vite + React) dibujan su propio marco
# "Escritorio/Móvil" cargándose a sí mismas dentro de un iframe interno del
# mismo origen. Bajo file:// eso funciona sin problema (no hay servidor ni
# headers), pero servido por Netlify el X-Frame-Options: DENY de arriba
# bloquea también ese auto-iframe del mismo sitio, dejando la pantalla en
# blanco. SAMEORIGIN sigue bloqueando que otros dominios enmarquen estas
# páginas (mismo nivel de protección para clickjacking externo) pero permite
# que el propio sitio se enmarque a sí mismo, que es justo lo que necesita
# este componente.
[[headers]]
  for = "/assets/prototipo-vibra/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/prototipo-final-vibra/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
